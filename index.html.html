<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fairytale Princess Avatar Voice Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- MediaPipe Face Mesh for Camera Head/Gaze Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        princess: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            gold: '#fbbf24',
                            lavender: '#e9d5ff'
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                        cute: ['Gaegu', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fff5f7;
            background-image: 
                radial-gradient(at 10% 10%, rgba(251, 207, 232, 0.5) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(233, 213, 255, 0.5) 0px, transparent 50%);
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(251, 113, 133, 0.25);
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.08);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 241, 242, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(251, 113, 133, 0.4);
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- ONE-TOUCH START OVERLAY FOR KIDS (Mobile & Tablet Browser Security Bypass) -->
    <div id="startOverlay" class="fixed inset-0 z-50 bg-gradient-to-b from-rose-200 via-pink-100 to-amber-100 flex flex-col items-center justify-center p-6 text-center cursor-pointer transition-all duration-500">
        <div class="animate-bounce mb-6 text-7xl md:text-8xl filter drop-shadow-lg">
            👑
        </div>
        <h1 class="font-cute font-bold text-3xl md:text-5xl text-rose-600 mb-3 drop-shadow-sm">
            동화 속 공주님 대화방
        </h1>
        <p class="font-cute text-lg md:text-2xl text-rose-500 mb-8 max-w-md">
            화면 어디든 살짝 터치하면<br>공주님이 반갑게 인사해요! 🌸
        </p>
        <button id="btnStartOverlay" class="px-8 py-5 rounded-full bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white font-cute font-bold text-2xl md:text-3xl shadow-xl shadow-pink-300 transform active:scale-95 transition-all flex items-center gap-3 border-4 border-white">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>공주님 만나기!</span>
        </button>
    </div>

    <!-- Header / Navbar -->
    <header class="w-full h-16 glass-panel border-b border-rose-200 px-4 md:px-6 flex items-center justify-between z-30 sticky top-0">
            <div id="statusPill" class="flex items-center space-x-2.5 px-4 py-1.5 rounded-full border border-pink-200 bg-white/80 text-xs font-semibold transition-all duration-300 shadow-sm">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="statusText" class="text-rose-600 tracking-wide font-cute text-sm">대기 중 🌸</span>
            </div>

            <button id="btnSettings" class="p-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-500 transition-all border border-rose-200" title="Settings">
                <i class="fa-solid fa-gear text-base"></i>
            </button>
        </div>
    </header>

    <!-- Hidden Video element for MediaPipe FaceMesh -->
    <video id="webcamVideo" class="hidden" playsinline></video>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 relative">
        
        <!-- Left Panel: Interactive Princess Avatar & Visualizer (7 Cols) -->
        <section class="lg:col-span-7 flex flex-col gap-4">
            <div class="glass-panel rounded-3xl p-4 flex flex-col items-center justify-between relative overflow-hidden h-[480px] md:h-[560px] border-2 border-rose-200">
                
                <!-- Emotion & State Badge -->
                <div class="absolute top-4 left-4 z-10 flex gap-2">
                    <span id="emotionBadge" class="text-xs font-cute font-bold px-3.5 py-1.5 rounded-full bg-rose-100 text-rose-600 border border-rose-300 shadow-sm">
                        기분: 기쁨 ✨
                    </span>
                </div>

                <!-- Hands-free Quick Bar on Top-Right of Avatar -->
                <div class="absolute top-4 right-4 z-10 flex gap-2">
                    <button id="toggleHandsFreeBtn" class="px-3.5 py-1.5 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-cute font-bold shadow-md shadow-rose-300 flex items-center gap-2 transition-all">
                        <i id="handsFreeIcon" class="fa-solid fa-microphone text-sm"></i>
                        <span id="handsFreeStatusText">자동 음성대화: ON (0.5초)</span>
                    </button>
                    <button id="toggleCameraBtn" class="px-3.5 py-1.5 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-cute font-bold shadow-md flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-camera text-sm"></i>
                        <span id="camStatusText">카메라 시선추적: OFF</span>
                    </button>
                </div>

                <!-- 2D Canvas Procedural Princess Avatar -->
                <div class="relative w-full h-full flex items-center justify-center">
                    <canvas id="avatarCanvas" class="w-full h-full max-w-[500px] max-h-[500px]"></canvas>
                </div>

                <!-- Bottom Audio Visualizer & Info -->
                <div class="w-full z-10 flex flex-col gap-2">
                    <div class="w-full h-10 relative flex items-center justify-center bg-rose-50/60 rounded-2xl border border-rose-200 px-2 overflow-hidden">
                        <canvas id="visualizerCanvas" class="w-full h-full"></canvas>
                    </div>

                    <div class="flex items-center justify-between text-xs font-cute text-rose-500 px-2 font-bold">
                        <span id="trackingInfo" class="flex items-center gap-1.5">
                            <i class="fa-solid fa-face-smile text-amber-400"></i> 마우스/카메라 시선 & 감정 동기화
                        </span>
                        <span class="flex items-center gap-1.5">
                            <i class="fa-solid fa-music text-pink-400"></i> 실시간 립싱크 적용
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Panel: Conversation Transcript & Text Console (5 Cols) -->
        <section class="lg:col-span-5 flex flex-col h-[480px] md:h-[560px] glass-panel rounded-3xl p-5 border-2 border-rose-200">
            <!-- Header -->
            <div class="flex items-center justify-between pb-3 border-b border-rose-100 mb-4">
                <div class="flex items-center space-x-2">
                    <span class="text-xl">👑</span>
                    <h2 class="text-base font-bold font-cute text-rose-600">공주님과의 대화 내용</h2>
                </div>
                <button id="btnClearChat" class="text-xs text-rose-400 hover:text-rose-600 transition-colors" title="대화 지우기">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

            <!-- Chat Stream Box -->
            <div id="chatContainer" class="flex-1 overflow-y-auto pr-2 space-y-4 text-sm font-sans">
                <!-- System Greeting Message -->
                <div class="flex gap-3 items-start">
                    <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-500 border border-rose-200 flex items-center justify-center shrink-0 mt-0.5 text-base shadow-sm">
                        👑
                    </div>
                    <div class="bg-white border border-rose-100 p-3.5 rounded-2xl rounded-tl-none text-slate-700 max-w-[85%] shadow-sm leading-relaxed">
                        안녕! 나는 동화 속 공주님이야 💖 반가워! 카메라 버튼을 누르면 내 눈이 너를 따라다닐 거야!
                    </div>
                </div>
            </div>

            <!-- Manual Input Form -->
            <form id="chatForm" class="mt-4 flex gap-2 relative items-center">
                <input type="text" id="userInput" placeholder="공주님에게 짧게 말을 걸어보세요..." class="w-full bg-white text-slate-800 placeholder-rose-300 rounded-2xl px-4 py-3 text-sm border-2 border-rose-200 focus:outline-none focus:border-rose-400 transition-all pr-24 shadow-sm" />
                
                <div class="absolute right-2 flex items-center gap-1.5">
                    <button type="button" id="btnMicTrigger" class="p-2.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-500 transition-all" title="음성 말하기">
                        <i id="micIcon" class="fa-solid fa-microphone text-sm"></i>
                    </button>
                    <button type="submit" id="btnSend" class="p-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white transition-all shadow-md shadow-rose-300">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-rose-950/30 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 border-2 border-rose-300 shadow-2xl relative bg-white">
            <div class="flex justify-between items-center pb-4 border-b border-rose-100 mb-5">
                <h3 class="font-cute text-xl font-bold text-rose-600 flex items-center gap-2">
                    ⚙️ 대화 설정
                </h3>
                <button id="btnCloseModal" class="text-rose-400 hover:text-rose-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="space-y-4 text-xs font-sans">
                <!-- Gemini API Key Field -->
                <div>
                    <label class="block text-slate-700 font-semibold mb-1.5" for="apiKeyInput">Gemini API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-rose-50/50 border border-rose-200 rounded-xl px-3 py-2.5 text-slate-700 focus:outline-none focus:border-rose-400 font-mono text-xs">
                </div>

                <!-- Voice Selection Field -->
                <div>
                    <label class="block text-slate-700 font-semibold mb-1.5" for="voiceSelect">공주님 목소리 선택 (TTS)</label>
                    <select id="voiceSelect" class="w-full bg-rose-50/50 border border-rose-200 rounded-xl px-3 py-2.5 text-slate-700 focus:outline-none focus:border-rose-400 text-xs"></select>
                </div>

                <!-- System Persona Prompt -->
                <div>
                    <label class="block text-slate-700 font-semibold mb-1.5" for="systemPromptInput">공주님 성격 지침 (Persona)</label>
                    <textarea id="systemPromptInput" rows="3" class="w-full bg-rose-50/50 border border-rose-200 rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:border-rose-400 text-xs"></textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-2">
                <button id="btnSaveSettings" class="w-full py-3 bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white rounded-xl font-cute font-bold text-base shadow-lg shadow-pink-300 transition-all">
                    설정 저장하기 💕
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-3 text-xs text-rose-400 font-cute border-t border-rose-100 bg-white/60">
        카메라 시선 추적 및 감정 표현이 가능한 어린이 공주님 AI 대화 플랫폼 ✨
    </footer>

    <!-- MAIN APP SCRIPT -->
    <script>
        /**
         * State Management & Configuration
         */
        // URL Parameter Support for easy shared links (e.g., https://my-app.com/?key=AIzaSy...)
        const urlParams = new URLSearchParams(window.location.search);
        const urlKey = urlParams.get('key');

        const state = {
            // Priority: URL Param Key > LocalStorage Key > Fallback Embedded Key
            apiKey: urlKey || localStorage.getItem('gemini_api_key') || '',
            systemPrompt: localStorage.getItem('system_prompt') || '너는 어린아이들에게 아주 상냥하고 다정하게 대답하는 동화 나라의 예쁜 공주님이야. 대답은 절대로 길게 하지 말고, 1~2줄 이내의 아주 짧고 귀여운 쉬운 문장으로만 대화해줘. 아이가 질문하면 칭찬하거나 공감해주며 기쁨, 슬픔, 놀라움, 호기심 등 감정에 맞는 뉘앙스를 담아줘.',
            selectedVoiceIndex: parseInt(localStorage.getItem('voice_index')) || 0,
            isHandsFree: true, // Default to continuous automatic mode
            isListening: false,
            isSpeaking: false,
            isThinking: false,
            isCameraActive: false,
            emotion: 'HAPPY',
            mouthOpenRatio: 0,
            gazeX: 0,
            gazeY: 0,
            targetGazeX: 0,
            targetGazeY: 0,
            voices: []
        };

        // DOM Element Cache
        const DOM = {
            startOverlay: document.getElementById('startOverlay'),
            btnStartOverlay: document.getElementById('btnStartOverlay'),
            avatarCanvas: document.getElementById('avatarCanvas'),
            visualizerCanvas: document.getElementById('visualizerCanvas'),
            webcamVideo: document.getElementById('webcamVideo'),
            statusPill: document.getElementById('statusPill'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            emotionBadge: document.getElementById('emotionBadge'),
            trackingInfo: document.getElementById('trackingInfo'),
            chatContainer: document.getElementById('chatContainer'),
            chatForm: document.getElementById('chatForm'),
            userInput: document.getElementById('userInput'),
            btnMicTrigger: document.getElementById('btnMicTrigger'),
            micIcon: document.getElementById('micIcon'),
            toggleHandsFreeBtn: document.getElementById('toggleHandsFreeBtn'),
            toggleCameraBtn: document.getElementById('toggleCameraBtn'),
            camStatusText: document.getElementById('camStatusText'),
            handsFreeStatusText: document.getElementById('handsFreeStatusText'),
            btnClearChat: document.getElementById('btnClearChat'),
            btnSettings: document.getElementById('btnSettings'),
            settingsModal: document.getElementById('settingsModal'),
            btnCloseModal: document.getElementById('btnCloseModal'),
            btnSaveSettings: document.getElementById('btnSaveSettings'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            voiceSelect: document.getElementById('voiceSelect'),
            systemPromptInput: document.getElementById('systemPromptInput')
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function updateStatus(status, text, dotClass) {
            DOM.statusText.textContent = text;
            DOM.statusDot.className = `w-2.5 h-2.5 rounded-full ${dotClass} animate-pulse`;
        }

        /**
         * MediaPipe Camera & FaceMesh Gaze Tracking
         */
        let faceMesh = null;
        let camera = null;

        function initFaceMesh() {
            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults((results) => {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const landmarks = results.multiFaceLandmarks[0];
                    // Nose tip is landmark 1
                    const nose = landmarks[1];
                    // Map nose position (0.0 to 1.0) to screen gaze offset (-1 to 1)
                    state.targetGazeX = (nose.x - 0.5) * -2.5; // Invert horizontally for mirror effect
                    state.targetGazeY = (nose.y - 0.5) * 2.0;
                }
            });
        }

        async function toggleCamera() {
            if (state.isCameraActive) {
                if (camera) {
                    camera.stop();
                }
                state.isCameraActive = false;
                if (DOM.camStatusText) DOM.camStatusText.textContent = '카메라 시선추적: OFF';
                if (DOM.toggleCameraBtn) {
                    DOM.toggleCameraBtn.classList.replace('bg-emerald-500', 'bg-rose-50');
                    DOM.toggleCameraBtn.classList.replace('text-white', 'text-rose-600');
                }
                if (DOM.trackingInfo) DOM.trackingInfo.innerHTML = `<i class="fa-solid fa-face-smile text-amber-400"></i> 마우스 시선 & 감정 동기화`;
            } else {
                if (!faceMesh) {
                    initFaceMesh();
                }
                try {
                    camera = new Camera(DOM.webcamVideo, {
                        onFrame: async () => {
                            if (state.isCameraActive) {
                                await faceMesh.send({ image: DOM.webcamVideo });
                            }
                        },
                        width: 640,
                        height: 480
                    });
                    await camera.start();
                    state.isCameraActive = true;
                    if (DOM.camStatusText) DOM.camStatusText.textContent = '카메라 시선추적: ON 📸';
                    if (DOM.toggleCameraBtn) {
                        DOM.toggleCameraBtn.classList.replace('bg-rose-50', 'bg-emerald-500');
                        DOM.toggleCameraBtn.classList.replace('text-rose-600', 'text-white');
                    }
                    if (DOM.trackingInfo) DOM.trackingInfo.innerHTML = `<i class="fa-solid fa-camera text-emerald-400"></i> 카메라 실시간 시선추적 중 ✨`;
                } catch (e) {
                    console.warn('Camera Access Error:', e);
                }
            }
        }

        /**
         * Speech Recognition (STT)
         */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onstart = () => {
                state.isListening = true;
                updateStatus('LISTENING', '듣고 있어요...', 'bg-pink-400');
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript.trim()) {
                    appendChatMessage('user', finalTranscript);
                    fetchGeminiResponse(finalTranscript);
                }
            };

            recognition.onerror = () => {
                state.isListening = false;
                DOM.btnMicTrigger.classList.remove('text-rose-500', 'animate-pulse');
                if (state.isHandsFree && !state.isSpeaking && !state.isThinking) {
                    setTimeout(startListening, 500);
                } else {
                    updateStatus('IDLE', '대기 중 🌸', 'bg-emerald-400');
                }
            };

            recognition.onend = () => {
                state.isListening = false;
                DOM.btnMicTrigger.classList.remove('text-rose-500', 'animate-pulse');
                
                if (state.isHandsFree && !state.isSpeaking && !state.isThinking) {
                    setTimeout(startListening, 500);
                } else if (!state.isSpeaking && !state.isThinking) {
                    updateStatus('IDLE', '대기 중 🌸', 'bg-emerald-400');
                }
            };
        }

        function startListening() {
            if (!recognition || state.isSpeaking || state.isThinking || state.isListening) return;
            try {
                state.isListening = true;
                recognition.start();
                DOM.btnMicTrigger.classList.add('text-rose-500', 'animate-pulse');
            } catch (e) {
                // Handle cases where recognition is already started or transitioning
                state.isListening = false;
                DOM.btnMicTrigger.classList.remove('text-rose-500', 'animate-pulse');
            }
        }

        function stopListening() {
            if (recognition) {
                state.isListening = false;
                try {
                    recognition.stop();
                } catch (e) {}
            }
        }

        /**
         * Speech Synthesis (TTS) Voices Setup
         */
        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            state.voices = window.speechSynthesis.getVoices();
            if (DOM.voiceSelect) {
                DOM.voiceSelect.innerHTML = '';
                state.voices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    if (index === state.selectedVoiceIndex || (voice.lang.includes('ko') && !DOM.voiceSelect.value)) {
                        option.selected = true;
                    }
                    DOM.voiceSelect.appendChild(option);
                });
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (state.voices.length > 0) {
                const selectedVoice = state.voices[state.selectedVoiceIndex] || state.voices.find(v => v.lang.includes('ko'));
                if (selectedVoice) utterance.voice = selectedVoice;
            }
            
            utterance.pitch = 1.25;
            utterance.rate = 1.05;

            let lipSyncInterval = null;

            utterance.onstart = () => {
                state.isSpeaking = true;
                updateStatus('SPEAKING', '말하는 중이에요 💕', 'bg-rose-500');

                lipSyncInterval = setInterval(() => {
                    if (state.isSpeaking) {
                        state.mouthOpenRatio = 0.2 + Math.random() * 0.7;
                    }
                }, 80);
            };

            utterance.onend = () => {
                state.isSpeaking = false;
                state.mouthOpenRatio = 0;
                if (lipSyncInterval) clearInterval(lipSyncInterval);
                updateStatus('IDLE', '대기 중 🌸', 'bg-emerald-400');

                // Auto-trigger microphone after 0.5 seconds (500ms)
                if (state.isHandsFree) {
                    setTimeout(startListening, 500);
                }
            };

            utterance.onerror = () => {
                state.isSpeaking = false;
                state.mouthOpenRatio = 0;
                if (lipSyncInterval) clearInterval(lipSyncInterval);
                updateStatus('IDLE', '대기 중 🌸', 'bg-emerald-400');

                if (state.isHandsFree) {
                    setTimeout(startListening, 500);
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        /**
         * Gemini API Interaction with Nuance & Emotion Detection
         */
        async function fetchGeminiResponse(userMessage) {
            state.isThinking = true;
            stopListening();
            updateStatus('THINKING', '생각하는 중... ✨', 'bg-amber-400');

            const apiKey = state.apiKey;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const fullPrompt = `${state.systemPrompt}\n\n사용자 메시지: "${userMessage}"\n\n[필수 규칙]: 답변 끝에 현재 감정을 [HAPPY], [SURPRISED], [CURIOUS], 또는 [SHY] 중 하나로 딱 단어만 골라 붙여서 대답해줘. 예시: "정말 멋진 생각이구나! [HAPPY]"\n답변은 절대 길게 하지 말고 1문장으로 짧게 해줘.`;

            const payload = {
                contents: [{ role: "user", parts: [{ text: fullPrompt }] }]
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API HTTP Error: ${response.status}`);

                const data = await response.json();
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "정말 반가워! [HAPPY]";

                // Parse emotion tag
                if (rawText.includes('[HAPPY]')) {
                    setEmotion('HAPPY', '기쁨 ✨');
                    rawText = rawText.replace('[HAPPY]', '').trim();
                } else if (rawText.includes('[SURPRISED]')) {
                    setEmotion('SURPRISED', '놀람 😮');
                    rawText = rawText.replace('[SURPRISED]', '').trim();
                } else if (rawText.includes('[CURIOUS]')) {
                    setEmotion('CURIOUS', '호기심 🧐');
                    rawText = rawText.replace('[CURIOUS]', '').trim();
                } else if (rawText.includes('[SHY]')) {
                    setEmotion('SHY', '부끄러움 😳');
                    rawText = rawText.replace('[SHY]', '').trim();
                } else {
                    setEmotion('HAPPY', '기쁨 ✨');
                }

                state.isThinking = false;
                appendChatMessage('ai', rawText);
                speakText(rawText);

            } catch (error) {
                console.error('Gemini API Error:', error);
                state.isThinking = false;
                setEmotion('HAPPY', '기쁨 ✨');
                updateStatus('ERROR', '오류 발생', 'bg-rose-500');
                
                const fallbackMsg = "앗, 잠시 신호가 약했어! 다시 말해줄래?";
                appendChatMessage('ai', fallbackMsg);
                speakText(fallbackMsg);
            }
        }

        function setEmotion(emotionKey, labelText) {
            state.emotion = emotionKey;
            DOM.emotionBadge.textContent = `기분: ${labelText}`;
        }

        function appendChatMessage(sender, message) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex gap-3 items-start animate-fade-in';

            if (sender === 'user') {
                wrapper.innerHTML = `
                    <div class="flex-1 flex justify-end">
                        <div class="bg-gradient-to-r from-rose-400 to-pink-400 text-white p-3.5 rounded-2xl rounded-tr-none max-w-[85%] shadow-sm text-xs sm:text-sm font-medium">
                            ${escapeHTML(message)}
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-pink-100 text-pink-500 border border-pink-200 flex items-center justify-center shrink-0 mt-0.5 text-sm shadow-sm">
                        👧
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-500 border border-rose-200 flex items-center justify-center shrink-0 mt-0.5 text-base shadow-sm">
                        👑
                    </div>
                    <div class="bg-white border border-rose-100 p-3.5 rounded-2xl rounded-tl-none text-slate-700 max-w-[85%] shadow-sm text-xs sm:text-sm leading-relaxed">
                        ${escapeHTML(message)}
                    </div>
                `;
            }

            DOM.chatContainer.appendChild(wrapper);
            DOM.chatContainer.scrollTop = DOM.chatContainer.scrollHeight;
        }

        /**
         * Procedural Princess Avatar Engine with Dynamic Facial Expressions
         */
        const avatar = {
            ctx: DOM.avatarCanvas.getContext('2d'),
            width: 500,
            height: 500,
            blinkProgress: 0,
            blinkTimer: 0,
            headBob: 0,
            
            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                // Fallback mouse gaze tracking when camera is off
                window.addEventListener('mousemove', (e) => {
                    if (state.isCameraActive) return;
                    const rect = DOM.avatarCanvas.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    
                    state.targetGazeX = (e.clientX - centerX) / (window.innerWidth / 2);
                    state.targetGazeY = (e.clientY - centerY) / (window.innerHeight / 2);
                });
            },

            resize() {
                const rect = DOM.avatarCanvas.parentElement.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                this.width = Math.min(rect.width, 500);
                this.height = Math.min(rect.height, 500);
                DOM.avatarCanvas.width = this.width * dpr;
                DOM.avatarCanvas.height = this.height * dpr;
                this.ctx.scale(dpr, dpr);
            },

            render() {
                const ctx = this.ctx;
                const w = this.width;
                const h = this.height;
                const cx = w / 2;
                const cy = h / 2 - 10;

                ctx.clearRect(0, 0, w, h);

                // Smooth LERP for Gaze Tracking
                state.gazeX += (state.targetGazeX - state.gazeX) * 0.1;
                state.gazeY += (state.targetGazeY - state.gazeY) * 0.1;

                // Breathing motion
                const time = Date.now() * 0.0025;
                this.headBob = Math.sin(time) * 3;

                // Blinking
                this.blinkTimer++;
                if (this.blinkTimer > 150 + Math.random() * 80) {
                    this.blinkProgress += 0.3;
                    if (this.blinkProgress >= Math.PI) {
                        this.blinkProgress = 0;
                        this.blinkTimer = 0;
                    }
                }
                const eyeScaleY = this.blinkProgress > 0 ? Math.max(0.05, Math.abs(Math.cos(this.blinkProgress))) : 1.0;
                const headY = cy + this.headBob;

                // 1. Aura Sparkle
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, headY - 10, 160, 0, Math.PI * 2);
                const auraGlow = ctx.createRadialGradient(cx, headY - 10, 60, cx, headY - 10, 170);
                auraGlow.addColorStop(0, 'rgba(253, 164, 175, 0.25)');
                auraGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = auraGlow;
                ctx.fill();
                ctx.restore();

                // 2. Long Hair (Back)
                ctx.save();
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.ellipse(cx, headY + 30, 115, 130, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 3. Princess Outfit Collar & Dress
                ctx.save();
                ctx.fillStyle = '#ffe4e6';
                ctx.fillRect(cx - 22, headY + 70, 44, 45);

                ctx.beginPath();
                ctx.ellipse(cx, headY + 150, 110, 65, 0, 0, Math.PI * 2);
                ctx.fillStyle = state.emotion === 'SURPRISED' ? '#ec4899' : '#fb7185';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, headY + 105, 45, 0, Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.restore();

                // 4. Face Base
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(cx, headY + 10, 80, 85, 0, 0, Math.PI * 2);
                ctx.fillStyle = state.emotion === 'SHY' ? '#ffe4e6' : '#fff1f2';
                ctx.shadowColor = 'rgba(244, 63, 94, 0.15)';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.restore();

                // 5. Cheeks Rosy Blush (Varies by emotion)
                ctx.save();
                const blushAlpha = state.emotion === 'SHY' ? 0.6 : 0.35;
                ctx.fillStyle = `rgba(251, 113, 133, ${blushAlpha})`;
                ctx.beginPath();
                ctx.ellipse(cx - 45, headY + 25, state.emotion === 'SHY' ? 17 : 14, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cx + 45, headY + 25, state.emotion === 'SHY' ? 17 : 14, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 6. Front Hair Bangs
                ctx.save();
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.moveTo(cx, headY - 70);
                ctx.quadraticCurveTo(cx - 50, headY - 60, cx - 82, headY - 20);
                ctx.quadraticCurveTo(cx - 50, headY - 25, cx, headY - 45);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(cx, headY - 70);
                ctx.quadraticCurveTo(cx + 50, headY - 60, cx + 82, headY - 20);
                ctx.quadraticCurveTo(cx + 50, headY - 25, cx, headY - 45);
                ctx.fill();
                ctx.restore();

                // 7. Golden Tiara
                ctx.save();
                const crownY = headY - 78;
                ctx.fillStyle = '#f59e0b';
                ctx.strokeStyle = '#d97706';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(cx - 45, crownY);
                ctx.lineTo(cx - 50, crownY - 30);
                ctx.lineTo(cx - 25, crownY - 15);
                ctx.lineTo(cx, crownY - 42);
                ctx.lineTo(cx + 25, crownY - 15);
                ctx.lineTo(cx + 50, crownY - 30);
                ctx.lineTo(cx + 45, crownY);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = state.emotion === 'SURPRISED' ? '#3b82f6' : '#f43f5e';
                ctx.beginPath();
                ctx.arc(cx, crownY - 30, 5, 0, Math.PI * 2);
                ctx.arc(cx - 45, crownY - 20, 3.5, 0, Math.PI * 2);
                ctx.arc(cx + 45, crownY - 20, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // 8. Eyes (Expressive matching emotion)
                const eyeOffsetX = 32;
                const eyeOffsetY = headY + 5;
                const pupilMaxOffset = 6;

                const drawEye = (isLeft) => {
                    const eyeX = isLeft ? cx - eyeOffsetX : cx + eyeOffsetX;
                    
                    ctx.save();
                    ctx.translate(eyeX, eyeOffsetY);
                    ctx.scale(1, eyeScaleY);

                    // Eye White
                    ctx.beginPath();
                    const eyeRadiusY = state.emotion === 'SURPRISED' ? 19 : 17;
                    ctx.ellipse(0, 0, 16, eyeRadiusY, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#fda4af';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Pupil with Gaze Tracking
                    const pX = state.gazeX * pupilMaxOffset;
                    const pY = state.gazeY * (pupilMaxOffset * 0.6);

                    ctx.beginPath();
                    const pupilRadius = state.emotion === 'CURIOUS' ? 11.5 : 10;
                    ctx.ellipse(pX, pY, pupilRadius, pupilRadius + 1, 0, 0, Math.PI * 2);
                    ctx.fillStyle = state.emotion === 'CURIOUS' ? '#4f46e5' : '#0284c7';
                    ctx.fill();

                    // Highlights
                    ctx.beginPath();
                    ctx.arc(pX - 3.5, pY - 4, 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(pX + 3, pY + 3, 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();

                    // Eyelashes & Brow
                    ctx.beginPath();
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = '#78350f';
                    if (state.emotion === 'CURIOUS') {
                        // Raised eyebrow
                        ctx.arc(0, -6, 17, Math.PI * 1.15, Math.PI * 1.85);
                    } else if (state.emotion === 'SHY') {
                        // Shy closed or curved eyes
                        ctx.arc(0, 0, 16, 0, Math.PI);
                    } else {
                        ctx.arc(0, -2, 17, Math.PI * 1.15, Math.PI * 1.85);
                    }
                    ctx.stroke();

                    ctx.restore();
                };

                drawEye(true);
                drawEye(false);

                // 9. Mouth Lip-Sync & Expression Engine
                ctx.save();
                const mouthX = cx;
                const mouthY = headY + 48;
                const baseMouthWidth = state.emotion === 'SURPRISED' ? 18 : 24;
                const mouthOpenHeight = state.mouthOpenRatio * 24;

                ctx.translate(mouthX, mouthY);

                if (state.mouthOpenRatio > 0.05) {
                    // Speaking / Open Mouth
                    ctx.beginPath();
                    ctx.ellipse(0, 0, baseMouthWidth / 2 + (state.mouthOpenRatio * 4), Math.max(3, mouthOpenHeight), 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#e11d48';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#fb7185';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 4, 6, 0, Math.PI);
                    ctx.fillStyle = '#fda4af';
                    ctx.fill();
                } else {
                    // Closed Mouth Expressions
                    ctx.beginPath();
                    if (state.emotion === 'SURPRISED') {
                        ctx.arc(0, 2, 8, 0, Math.PI * 2);
                        ctx.fillStyle = '#e11d48';
                        ctx.fill();
                    } else if (state.emotion === 'SHY') {
                        ctx.moveTo(-10, 2);
                        ctx.quadraticCurveTo(0, 6, 10, 2);
                        ctx.lineWidth = 2.5;
                        ctx.strokeStyle = '#e11d48';
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    } else {
                        // Happy Smile
                        ctx.moveTo(-baseMouthWidth / 2, -2);
                        ctx.quadraticCurveTo(0, 10, baseMouthWidth / 2, -2);
                        ctx.lineWidth = 2.5;
                        ctx.strokeStyle = '#e11d48';
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }
                }
                ctx.restore();

                requestAnimationFrame(() => this.render());
            }
        };

        /**
         * Bottom Audio Visualizer Bar
         */
        const visualizer = {
            ctx: DOM.visualizerCanvas.getContext('2d'),
            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },
            resize() {
                const rect = DOM.visualizerCanvas.parentElement.getBoundingClientRect();
                DOM.visualizerCanvas.width = rect.width;
                DOM.visualizerCanvas.height = rect.height;
            },
            render() {
                const ctx = this.ctx;
                const w = DOM.visualizerCanvas.width;
                const h = DOM.visualizerCanvas.height;

                ctx.clearRect(0, 0, w, h);

                const numBars = 28;
                const barWidth = w / numBars;

                for (let i = 0; i < numBars; i++) {
                    let barHeight = 4;

                    if (state.isSpeaking) {
                        barHeight = (Math.sin(Date.now() * 0.01 + i * 0.4) + 1) * (h / 2.5) * (state.mouthOpenRatio + 0.3);
                    } else if (state.isListening) {
                        barHeight = (Math.cos(Date.now() * 0.015 + i * 0.3) + 1) * (h / 3);
                    } else if (state.isThinking) {
                        barHeight = (Math.sin(Date.now() * 0.02 + i * 0.8) + 1) * (h / 4);
                    }

                    const x = i * barWidth;
                    const y = (h - barHeight) / 2;

                    ctx.fillStyle = state.isSpeaking ? 'rgba(244, 63, 94, 0.7)' : (state.isThinking ? 'rgba(251, 191, 36, 0.7)' : 'rgba(251, 113, 133, 0.5)');
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(x + 2, y, barWidth - 4, barHeight, 4);
                    } else {
                        ctx.rect(x + 2, y, barWidth - 4, barHeight);
                    }
                    ctx.fill();
                }

                requestAnimationFrame(() => this.render());
            }
        };

        /**
         * Event Listeners & UI Binding
         */
        DOM.chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = DOM.userInput.value.trim();
            if (!text) return;
            DOM.userInput.value = '';
            appendChatMessage('user', text);
            fetchGeminiResponse(text);
        });

        DOM.btnMicTrigger.addEventListener('click', () => {
            if (state.isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        DOM.toggleHandsFreeBtn.addEventListener('click', () => {
            state.isHandsFree = !state.isHandsFree;
            if (state.isHandsFree) {
                DOM.handsFreeStatusText.textContent = '자동 음성대화: ON (0.5초)';
                DOM.toggleHandsFreeBtn.classList.replace('bg-rose-500', 'bg-emerald-500');
                startListening();
            } else {
                DOM.handsFreeStatusText.textContent = '자동 음성대화: OFF';
                DOM.toggleHandsFreeBtn.classList.replace('bg-emerald-500', 'bg-rose-500');
                stopListening();
            }
        });

        DOM.toggleCameraBtn.addEventListener('click', () => {
            toggleCamera();
        });

        DOM.btnClearChat.addEventListener('click', () => {
            DOM.chatContainer.innerHTML = '';
        });

        // Settings Modal Listeners
        DOM.btnSettings.addEventListener('click', () => {
            DOM.apiKeyInput.value = state.apiKey;
            DOM.systemPromptInput.value = state.systemPrompt;
            DOM.settingsModal.classList.remove('opacity-0', 'pointer-events-none');
        });

        DOM.btnCloseModal.addEventListener('click', () => {
            DOM.settingsModal.classList.add('opacity-0', 'pointer-events-none');
        });

        DOM.btnSaveSettings.addEventListener('click', () => {
            state.apiKey = DOM.apiKeyInput.value.trim();
            state.systemPrompt = DOM.systemPromptInput.value.trim();
            state.selectedVoiceIndex = parseInt(DOM.voiceSelect.value) || 0;

            localStorage.setItem('gemini_api_key', state.apiKey);
            localStorage.setItem('system_prompt', state.systemPrompt);
            localStorage.setItem('voice_index', state.selectedVoiceIndex);

            DOM.settingsModal.classList.add('opacity-0', 'pointer-events-none');
        });

        // Application Initialization
        window.onload = () => {
            avatar.init();
            avatar.render();
            visualizer.init();
            visualizer.render();

            // Mobile/Tablet Audio Context Warm-up & One-Touch Start Setup
            const handleFirstTouchStart = async () => {
                // Fade out start overlay
                DOM.startOverlay.classList.add('opacity-0', 'pointer-events-none');
                
                // Warm up Web Speech Synthesis audio engine (required on iOS Safari)
                if ('speechSynthesis' in window) {
                    const dummyUtterance = new SpeechSynthesisUtterance('');
                    window.speechSynthesis.speak(dummyUtterance);
                }

                // Initial Greeting Voice
                speakText("안녕! 나는 동화 속 공주님이야 💖 반가워! 나랑 대화하자!");

                // Automatically try to turn on camera tracking if available
                toggleCamera().catch(() => {});

                // Start continuous listening loop after greeting
                if (state.isHandsFree) {
                    setTimeout(startListening, 1500);
                }
            };

            DOM.startOverlay.addEventListener('click', handleFirstTouchStart);
        };
    </script>
</body>
</html>
